nelmio_security:
    # X-Frame-Options
    clickjacking:
        paths:
            '^/.*': DENY

    # X-Content-Type-Options
    content_type:
        nosniff: true

    # Content Security Policy
    csp:
        enabled: true
        hosts: []
        content_types: []
        enforce:
            level1_fallback: false
            # Simple keywords for compatibility
            default-src: [ 'self' ]
            script-src:
                - 'self'
                - 'unsafe-inline'
                - 'unsafe-eval'
                - 'data:'
            style-src:
                - 'self'
                - 'unsafe-inline'
            img-src:
                - 'self'
                - 'data:'
            connect-src: [ 'self' ]
            font-src: [ 'self' ]
            object-src: [ 'none' ]
            base-uri: [ 'self' ]
            form-action: [ 'self' ]
            frame-ancestors: [ 'none' ]
            upgrade-insecure-requests: true

    # Referrer Policy
    referrer_policy:
        enabled: true
        policies: [ 'no-referrer-when-downgrade' ]
